name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # shortcut: major bumps are left open for manual review because a breaking
      # release would fail the deploy build; revisit if we add PR CI that proves it builds
      - name: Approve and merge Dependabot PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR"
          # Auto-merge can't be enabled without branch protection rules, so merge directly.
          # Retry while GitHub finishes computing mergeability.
          for _ in 1 2 3 4 5; do
            gh pr merge --squash "$PR" && exit 0
            sleep 10
          done
          exit 1
